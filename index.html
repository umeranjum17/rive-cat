<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rive cat</title>
<style>
  html,body{margin:0;height:100%;display:grid;place-items:center;background:#f6f1e7;
            font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#7a6a55;
            -webkit-tap-highlight-color:transparent}
  canvas{width:min(80vmin,460px);height:auto;aspect-ratio:1;cursor:pointer;touch-action:manipulation}
  p{position:fixed;bottom:18px;margin:0;opacity:.75;text-align:center}
  b{color:#4a3f31}
  #hint{transition:opacity .4s}
</style>
<canvas id="c" width="840" height="840"></canvas>
<p id="hint"><b>pet the cat</b> — click or tap</p>
<script src="https://unpkg.com/@rive-app/canvas@2"></script>
<script>
  const c = document.getElementById('c'), hint = document.getElementById('hint');
  let pet = null, pets = 0;

  const r = new rive.Rive({
    src: 'mycat.riv?v=4', canvas: c, autoplay: true, stateMachines: 'SM',
    onLoad: () => {
      r.resizeDrawingSurfaceToCanvas();
      pet = r.stateMachineInputs('SM').find(i => i.name === 'pet');
      document.title += ' ✓';
    },
  });

  c.addEventListener('pointerdown', () => {
    if (!pet) return;
    pet.fire();
    pets++;
    hint.innerHTML = pets < 5
      ? '<b>' + pets + '</b> pet' + (pets > 1 ? 's' : '')
      : '<b>' + pets + '</b> pets — ok, that\'s plenty';
  });

  addEventListener('resize', () => r.resizeDrawingSurfaceToCanvas());
</script>
